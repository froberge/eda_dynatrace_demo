---
# Dynatrace events arrive via AAP Token Event Stream (map to source dynatrace_events on the activation).
# Remediation runs on Automation Controller as a Workflow Job Template.
- name: Dynatrace K8s pod remediation
  hosts: all
  sources:
    - name: dynatrace_events
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Remediate failing Kubernetes pod and close ServiceNow incident
      condition: >
        event.payload is defined
        and event.payload.eventData is defined
        and event.payload.eventData.eventType is defined
        and event.payload.eventData.eventType == "K8S_POD_REMEDIATION"
        and event.payload.eventData.namespace is defined
        and event.payload.eventData.pod_name is defined
        and event.payload.eventData.incident_number is defined
      action:
        run_workflow_template:
          name: remediate_k8s_cluster
          organization: Default
          job_args:
            extra_vars:
              eda_payload: "{{ event }}"
