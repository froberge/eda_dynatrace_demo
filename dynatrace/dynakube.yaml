# Kubernetes platform monitoring + Application observability for load-test-app.
# Injects OneAgent code modules only into namespaces labeled dt-monitoring=true.
#
# Edit spec.apiUrl before apply:
#   SaaS:  https://<environment-id>.live.dynatrace.com/api
#   Labs:  https://<environment-id>.sprint.dynatracelabs.com/api
#          https://<environment-id>.dynatracelabs.com/api
#
# Do not apply a second DynaKube whose namespaceSelector overlaps an existing
# DynaKube (for example openshift-july-agents). Use that instance instead and
# only apply ia-lab-monitoring.yaml, then restart the app pod.
apiVersion: dynatrace.com/v1beta5
kind: DynaKube
metadata:
  name: dynakube
  namespace: dynatrace
  labels:
    app.kubernetes.io/part-of: eda-dynatrace-demo
    app.kubernetes.io/component: dynatrace-operator
  annotations:
    feature.dynatrace.com/injection-readonly-volume: "true"
    # OpenShift SCCs often reject RuntimeDefault on the injected init container.
    feature.dynatrace.com/init-container-seccomp-profile: "false"
spec:
  apiUrl: https://yhe93220.live.dynatrace.com/api
  tokens: dynakube
  metadataEnrichment:
    enabled: true
    namespaceSelector:
      matchLabels:
        dt-monitoring: "true"
  oneAgent:
    applicationMonitoring:
      namespaceSelector:
        matchLabels:
          dt-monitoring: "true"
  activeGate:
    capabilities:
      - routing
      - kubernetes-monitoring
      - dynatrace-api
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1.5Gi
