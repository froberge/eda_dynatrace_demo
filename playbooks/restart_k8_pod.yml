---
- name: Remediate Kubernetes pod
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    group/kubernetes.core.k8s:
      host: "{{ k8s_auth_host }}"
      api_key: "{{ k8s_auth_api_key }}"
      validate_certs: "{{ k8s_validate_certs }}"
      ca_cert: "{{ k8s_ssl_ca_cert if (k8s_ssl_ca_cert | length > 0) else omit }}"

  vars:
    # Injected by AAP "OpenShift or Kubernetes API Bearer Token" on the job template
    k8s_auth_host: "{{ lookup('env', 'K8S_AUTH_HOST') | default('', true) | regex_replace('/$', '') }}"
    k8s_auth_api_key: "{{ lookup('env', 'K8S_AUTH_API_KEY') | default('', true) }}"
    k8s_validate_certs: >-
      {{ lookup('env', 'K8S_AUTH_VERIFY_SSL') | default('yes', true) | lower
         not in ['no', 'false', '0'] }}
    k8s_ssl_ca_cert: "{{ lookup('env', 'K8S_AUTH_SSL_CA_CERT') | default('', true) }}"
    load_test_app_namespace: ia-lab
    load_test_app_manifest: "{{ playbook_dir }}/../k8s/load-test-app-pod.yaml"
    pod_restart_wait_timeout: 300

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - namespace | length > 0
          - pod_name | length > 0
        fail_msg: >-
          namespace and pod_name are required
          (from Dynatrace workflow / EDA event payload).

    - name: Validate Kubernetes API credential is available to the job
      ansible.builtin.assert:
        that:
          - k8s_auth_host | length > 0
          - k8s_auth_api_key | length > 0
        fail_msg: >-
          No Kubernetes API authentication in this job (modules would call the API as
          system:anonymous). On job template EDA - Remediate K8s Pod, attach credential
          type OpenShift or Kubernetes API Bearer Token, then sync the project and re-run.
          For workflow launches, enable Prompt on launch for credentials if your AAP
          version requires selecting the credential at launch.

    - name: Read pod state
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ pod_name }}"
        namespace: "{{ namespace }}"
      register: pod_info

    - name: Record whether pod exists
      ansible.builtin.set_fact:
        pod_exists: "{{ pod_info.resources | length > 0 }}"

    - name: Pod not found — skip remediation
      ansible.builtin.set_fact:
        pod_remediation_performed: false
      when: not pod_exists | bool

    - name: Delete existing pod and re-apply manifest
      when: pod_exists | bool
      block:
        - name: Remove pod
          kubernetes.core.k8s:
            api_version: v1
            kind: Pod
            name: "{{ pod_name }}"
            namespace: "{{ namespace }}"
            state: absent
            wait: true
            wait_timeout: "{{ pod_restart_wait_timeout }}"

        - name: Apply load-test-app pod manifest
          kubernetes.core.k8s:
            state: present
            src: "{{ load_test_app_manifest }}"
            wait: true
            wait_condition:
              type: Ready
              status: "True"
            wait_timeout: "{{ pod_restart_wait_timeout }}"

        - name: Mark remediation complete
          ansible.builtin.set_fact:
            pod_remediation_performed: true

    - name: Report pod deleted and manifest reapplied
      ansible.builtin.debug:
        msg: >-
          Deleted pod {{ pod_name }} in namespace {{ namespace }}
          and reapplied {{ load_test_app_manifest }}.
      when: pod_remediation_performed | default(false) | bool

    - name: Report pod not found
      ansible.builtin.debug:
        msg: >-
          Pod {{ pod_name }} was not found in namespace {{ namespace }};
          no delete or apply performed.
      when: not (pod_remediation_performed | default(false) | bool)
