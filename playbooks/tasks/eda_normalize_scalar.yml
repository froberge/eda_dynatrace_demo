# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json#/$defs/tasks
---
# Set fact {{ eda_fact }} from {{ eda_raw }} (first element of a list or bracketed string).
- name: Normalize EDA value from YAML or JSON list for {{ eda_fact }}
  ansible.builtin.set_fact:
    "{{ eda_fact }}": "{{ eda_raw | first }}"
  when: eda_raw is sequence and eda_raw is not string

- name: Normalize EDA value from bracketed string for {{ eda_fact }}
  ansible.builtin.set_fact:
    "{{ eda_fact }}": "{{ (eda_raw | string)[1:-1] | split(',') | map('trim') | map('replace', \"'\", '') | map('replace', '\"', '') | first | default('') }}"
  when:
    - eda_raw is string
    - (eda_raw | string | length) >= 2
    - (eda_raw | string)[0] == '['

- name: Normalize EDA value from plain string for {{ eda_fact }}
  ansible.builtin.set_fact:
    "{{ eda_fact }}": "{{ eda_raw | string }}"
  when:
    - eda_raw is string
    - (eda_raw | string | length) == 0 or (eda_raw | string)[0] != '['
