---
# Set fact {{ eda_fact }} to a list from {{ eda_raw }}.
- name: Set {{ eda_fact }} from YAML/JSON list
  ansible.builtin.set_fact:
    "{{ eda_fact }}": "{{ eda_raw | list }}"
  when: eda_raw is sequence and eda_raw is not string

- name: Set {{ eda_fact }} from bracketed string
  ansible.builtin.set_fact:
    "{{ eda_fact }}": "{{ (eda_raw | string)[1:-1] | split(',') | map('trim') | map('replace', \"'\", '') | map('replace', '\"', '') | list }}"
  when:
    - eda_raw is string
    - (eda_raw | string | length) >= 2
    - (eda_raw | string)[0] == '['

- name: Set {{ eda_fact }} from plain string
  ansible.builtin.set_fact:
    "{{ eda_fact }}": "{{ [eda_raw | string] }}"
  when:
    - eda_raw is string
    - (eda_raw | string | length) == 0 or (eda_raw | string)[0] != '['
