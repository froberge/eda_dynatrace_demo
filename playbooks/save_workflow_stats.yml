---
- name: Save the different variable used in the workflow
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Load event data from EDA payload
      ansible.builtin.set_fact:
        _event_data: "{{ eda_payload.payload.eventData }}"
        _namespace_raw: "{{ eda_payload.payload.eventData.namespace | default('') }}"
        _pod_name_raw: "{{ eda_payload.payload.eventData.pod_name | default('') }}"

    - name: Normalize namespace
      ansible.builtin.include_tasks:
        file: tasks/eda_normalize_scalar.yml
      vars:
        eda_raw: "{{ _namespace_raw }}"
        eda_fact: namespace

    - name: Normalize pod names
      ansible.builtin.include_tasks:
        file: tasks/eda_normalize_list.yml
      vars:
        eda_raw: "{{ _pod_name_raw }}"
        eda_fact: pod_names

    - name: Save the value for the workflow for later use
      ansible.builtin.set_stats:
        data:
          eventType: "{{ _event_data['eventType'] }}"
          namespace: "{{ namespace | default('') }}"
          pod_name: "{{ pod_names | default([]) }}"
          sn_incident_number: "{{ _event_data['incident_number'] }}"
          dynatrace_problem_id: "{{ _event_data['problem_id'] | default('') }}"
