---
- name: Save the different variable used in the workflow
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Normalize list-like namespace and pod_name from event payload
      ansible.builtin.set_fact:
        _event_data: "{{ eda_payload.payload.eventData }}"
        "{{ item.key }}": "{{ scalar | default('') }}"
      loop:
        - key: namespace
          raw: "{{ eda_payload.payload.eventData.namespace | default('') }}"
        - key: pod_name
          raw: "{{ eda_payload.payload.eventData.pod_name | default('') }}"
      vars:
        scalar: >-
          {% if item.raw is sequence and item.raw is not mapping and item.raw is not string %}
          {{ item.raw | first }}
          {% elif (item.raw | string) is match('^\[.*\]$') %}
          {{ (item.raw | string) | regex_replace('^\[', '') | regex_replace('\]$', '') | trim | regex_replace("^[\\\"']|[\\\"']$", '') | trim }}
          {% else %}
          {{ item.raw }}
          {% endif %}

    - name: Save the value for the workflow for later use
      ansible.builtin.set_stats:
        data:
          eventType: "{{ _event_data['eventType'] }}"
          namespace: "{{ namespace }}"
          pod_name: "{{ pod_name }}"
          sn_incident_number: "{{ _event_data['incident_number'] }}"
          dynatrace_problem_id: "{{ _event_data['problem_id'] | default('') }}"
