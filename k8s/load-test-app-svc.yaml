apiVersion: v1
kind: Service
metadata:
  name: load-test-app
  namespace: ia-lab
  labels:
    app: load-test-app
spec:
  selector:
    app: load-test-app
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: load-test-app
  namespace: ia-lab
  labels:
    app: load-test-app
spec:
  to:
    kind: Service
    name: load-test-app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
