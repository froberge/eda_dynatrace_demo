kind: Pod
apiVersion: v1
metadata:
  name: load-test-app
  namespace: ia-lab
  labels:
    app: load-test-app
  # OneAgent injection is enabled by namespace label dt-monitoring=true
  # (see dynatrace/ia-lab-monitoring.yaml). Recreate this pod after DynaKube is Ready.
spec:
  securityContext:
    runAsUser: 0
  containers:
  - image: gokev/load-test-app
    name: load-test-app
    ports:
    - name: http
      containerPort: 80
      protocol: TCP
    # Cap memory so application-only GiB-hour billing is not based on node size.
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m
